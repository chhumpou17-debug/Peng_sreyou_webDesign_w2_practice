<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width:100%;
        }
        table,th,td{
            border-collapse: collapse;
            border:1px solid black;
            padding: 8px;
            text-align: left;
        }
        th{
            background-color: darkgray;
        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Product Catalog</h2>
    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>InStock</th>
        </tr>
        <tr>
            <td>T-shirt</td>
            <td>10$</td>
            <td>5</td>
            <td>yes</td>
        </tr>
        <tr>
            <td>hat</td>
            <td>5$</td>
            <td>50</td>
            <td>yes</td>
        </tr>
        <tr>
            <td>shoes</td>
            <td>15$</td>
            <td>3</td>
            <td>No</td>
        </tr>
    </table>
</body>
</html>
